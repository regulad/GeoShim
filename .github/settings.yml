# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: GeoShim
  description: >-
    System-wide iOS location spoofing by hooking locationd, so it reaches
    roothide-blacklisted apps that block tweak injection. Rewrites
    CLLocation/CLVisit on the daemon's XPC serialization path and defeats
    sourceInformation.isSimulatedBySoftware.
  homepage: ""
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: "ios, jailbreak, tweak, roothide, dopamine, location-spoofing, gps-spoofing, corelocation, locationd, theos, ellekit, arm64e, ios15"
  default_branch: master

  allow_merge_commit: true
